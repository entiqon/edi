name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GoTestX
        run: go install github.com/entiqon/gotestx@v1.0.0

      - name: Run tests with coverage
        run: gotestx -cq ./...

      - name: Show coverage %
        run: go tool cover -func=coverage.out | grep total

      - name: Enforce minimum 80% coverage
        shell: bash
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage: $pct%"
          awk -v p="$pct" 'BEGIN {exit !(p >= 80)}'

      # Upload coverage ONLY after merge to main
      - name: Upload coverage to Codecov (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: gotestx
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}