name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect .go changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"..."${{ github.sha }}")"
          else
            CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -E '\.go$' >/dev/null; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install GoTestX
        if: steps.changes.outputs.go_changed == 'true'
        run: go install github.com/entiqon/gotestx@v1.0.0

      - name: Run tests with coverage (excluding cmd/)
        if: steps.changes.outputs.go_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Exclude any packages under cmd/
          pkgs="$(go list ./... | grep -v '/cmd\(/.*\)\?$' || true)"

          if [[ -z "$pkgs" ]]; then
            echo "No packages to test (after excluding cmd/)."
            exit 0
          fi

          # gotestx should write coverage.out in repo root when -c is used
          gotestx -c $pkgs

      - name: Show coverage %
        if: steps.changes.outputs.go_changed == 'true'
        run: |
          echo "Total coverage:"
          go tool cover -func=coverage.out | grep total

      - name: Enforce minimum 80% coverage
        if: steps.changes.outputs.go_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage: $pct%"
          awk -v p="$pct" 'BEGIN {exit !(p >= 80)}'

      # Upload ONLY after "Rebase and merge" (i.e., push to main)
      - name: Upload coverage report to Codecov
        if: steps.changes.outputs.go_changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: gotestx
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Skip tests (no .go changes)
        if: steps.changes.outputs.go_changed != 'true'
        run: echo "No .go files changed; skipping tests + coverage."